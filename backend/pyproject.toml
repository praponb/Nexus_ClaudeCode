[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-inventory-backend"
version = "0.2.0"
description = "Asset Inventory Web Application - Django/DRF backend"
requires-python = ">=3.12"
dependencies = [
    # Django 6.0 per stack baseline (A-06); falls back to newest stable 5.2 LTS
    # if 6.0 is unavailable on the target platform (see backend/README.md).
    "django>=5.2,<6.2",
    "djangorestframework>=3.15,<4",
    "django-filter>=24.2,<26",
    "drf-spectacular>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "django-cors-headers>=4.4,<5",
    "argon2-cffi>=23.1",
    "celery[redis]>=5.4,<6",
    "django-storages>=1.14,<2",
    "qrcode>=7.4,<9",
    "pyotp>=2.9,<3",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.10",
    "django-stubs>=5",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Migrations are machine-generated artifacts; never lint/format them.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
DJANGO_SETTINGS_MODULE = "config.settings.test"
