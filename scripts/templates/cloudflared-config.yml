# Cloudflare Tunnel ingress for the Asset Inventory app on a Linux host.
#
# INSTALL: /etc/cloudflared/config.yml  (root:root, mode 644)
# The credentials file it names is a SECRET: root:root, mode 600.
#
# Fill in <TUNNEL_ID> with the tunnel's UUID. The UUID is not a secret (it is
# visible in the Cloudflare dashboard and in the public DNS CNAME target
# <TUNNEL_ID>.cfargotunnel.com) but it is left as a placeholder here so this
# template stays generic and the repo names no specific tunnel.
#
# IMPORTANT: one tunnel, one host. Running the same tunnel from two machines
# makes Cloudflare load-balance across both connections, which -- with a
# database on each -- serves users from whichever host their request landed on.
# Always stop cloudflared on the old host before starting it on the new one.

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

# Restart the tunnel gracefully rather than dropping in-flight requests.
grace-period: 30s

ingress:
  # The API path must come first: ingress rules are evaluated top-down and the
  # bare-hostname rule below would otherwise swallow /api/* into the frontend.
  - hostname: inventory.praponb.com
    path: ^/api/.*
    service: http://localhost:8000

  - hostname: inventory.praponb.com
    service: http://localhost:3000

  # Required terminal rule: anything not matched above is refused rather than
  # falling through to a service.
  - service: http_status:404
